<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanCut - Criar conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body class="auth-body">

  <div class="auth-bg">
    <div class="auth-bg-content">
      <div class="auth-bg-icon">✂</div>
      <h2>Bem-vindo à PlanCut</h2>
      <p>Organize sua agenda, seus serviços e o financeiro da sua barbearia em um só lugar.</p>
    </div>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <div class="auth-logo">✂</div>
      <h1>Criar conta</h1>
      <p class="auth-subtitle">Cadastre-se para começar a usar a PlanCut.</p>

      <form id="formCadastro">
        <div class="form-group">
          <label for="cadastroUsuario">Nome de usuário</label>
          <input type="text" id="cadastroUsuario" placeholder="Ex: joaobarbeiro" minlength="3" required>
        </div>
        <div class="form-group">
          <label for="cadastroEmail">E-mail</label>
          <input type="email" id="cadastroEmail" placeholder="seuemail@exemplo.com" required>
        </div>
        <div class="form-group">
          <label for="cadastroSenha">Senha</label>
          <input type="password" id="cadastroSenha" placeholder="Crie uma senha" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="cadastroConfirmarSenha">Confirmar senha</label>
          <input type="password" id="cadastroConfirmarSenha" placeholder="Repita a senha" minlength="6" required>
        </div>
        <button type="submit" class="btn-action auth-submit">Cadastrar</button>
      </form>

      <p class="auth-switch">Já tem uma conta? <a href="pages/login.html">Entrar</a></p>
    </div>
  </div>

  <script src="scripts/auth.js"></script>
</body>
</html>

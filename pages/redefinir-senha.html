
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanCut - Redefinir senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/auth.css">
</head>
<body class="auth-body">

  <div class="auth-bg">
    <div class="auth-bg-content">
      <div class="auth-bg-icon">✂</div>
      <h2>Vamos recuperar seu acesso</h2>
      <p>Escolha uma nova senha para voltar a acessar sua agenda.</p>
    </div>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <div class="auth-logo auth-logo-lock">🔒</div>

      <!-- ETAPA 1: informar o e-mail -->
      <section id="etapaEmail" class="reset-etapa">
        <h1>Redefinir senha</h1>
        <p class="auth-subtitle">Informe o e-mail cadastrado na sua conta PlanCut.</p>

        <form id="formEmailReset">
          <div class="form-group">
            <label for="resetEmail">E-mail</label>
            <input type="email" id="resetEmail" placeholder="seuemail@exemplo.com" required>
          </div>
          <button type="submit" class="btn-action auth-submit">Continuar</button>
        </form>
      </section>

      <!-- ETAPA 2: cadastrar nova senha -->
      <section id="etapaSenha" class="reset-etapa" hidden>
        <h1>Nova senha</h1>
        <p class="auth-subtitle">Crie uma nova senha para sua conta.</p>

        <form id="formRedefinirSenha">
          <div class="form-group">
            <label for="novaSenha">Nova senha</label>
            <input type="password" id="novaSenha" placeholder="Digite a nova senha" minlength="8" required>
          </div>
          <div class="form-group">
            <label for="confirmarNovaSenha">Confirmar nova senha</label>
            <input type="password" id="confirmarNovaSenha" placeholder="Repita a nova senha" minlength="8" required>
          </div>
          <button type="submit" class="btn-action auth-submit">Redefinir senha</button>
        </form>
      </section>

      <p class="auth-switch">Lembrou a senha? <a href="login.html">Entrar</a></p>
    </div>
  </div>

  <script src="../scripts/auth.js"></script>
</body>
</html>
